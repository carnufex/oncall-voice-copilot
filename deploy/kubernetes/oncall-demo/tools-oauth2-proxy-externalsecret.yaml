# Authentik OAuth2 client for oauth2-proxy in front of oncall.rosenvall.se.
# Same Bitwarden entries feed the Authentik blueprint (ONCALL_TOOLS_CLIENT_*).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oncall-tools-oauth2-proxy
  namespace: oncall-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: oncall-tools-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        client-id: "{{ .ONCALL_TOOLS_CLIENT_ID }}"
        client-secret: "{{ .ONCALL_TOOLS_CLIENT_SECRET }}"
        cookie-secret: "{{ .ONCALL_TOOLS_OAUTH2_COOKIE_SECRET }}"
  data:
    - secretKey: ONCALL_TOOLS_CLIENT_ID
      remoteRef: { key: 52a14747-6651-491c-b24b-b4bf012d55e3, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ONCALL_TOOLS_CLIENT_SECRET
      remoteRef: { key: 94b9acbe-20a2-4262-aaca-b4bf012d5621, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ONCALL_TOOLS_OAUTH2_COOKIE_SECRET
      remoteRef: { key: 34d65522-9674-4d74-8fd7-b4bf012d5660, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
