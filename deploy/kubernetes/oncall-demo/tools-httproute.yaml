# Public entry point for ElevenLabs webhook tools, the Slack slash command and
# the voice-call page. Cloudflare Tunnel already wildcard-routes *.rosenvall.se
# to gateway/external; this does the host match. Traffic goes through oauth2-proxy
# (Authentik SSO for the browser surface); /tools/*, /slack/*, /webhooks/* and
# /healthz bypass the session check and are token/signature-authenticated in the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oncall-tools
  namespace: oncall-demo
spec:
  hostnames:
    - oncall.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: oncall-tools-oauth2-proxy
          port: 4180
