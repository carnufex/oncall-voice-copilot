# Runtime secrets for the tool backend. Values live in Bitwarden Secrets
# Manager (homelab project, keys ONCALL_*). Placeholders are the literal string
# "unset" until the real credential exists; the app treats "unset" as
# "integration disabled" and keeps running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oncall-tools-secrets
  namespace: oncall-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: oncall-tools-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TOOL_API_TOKEN
      remoteRef: { key: 161d13d9-7c1f-4b3d-9e06-b4bf00d37e9e, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_API_KEY
      remoteRef: { key: 9be20d00-b521-49f6-a480-b4bf00d37ed5, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_AGENT_ID
      remoteRef: { key: 3cbf2014-da0f-4d77-8f14-b4bf00d37f1f, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_WEBHOOK_SECRET
      remoteRef: { key: 8d9e2e2f-e526-43d5-aaa8-b4bf00d37f69, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: SLACK_BOT_TOKEN
      remoteRef: { key: f51cf0de-77ca-4408-bbb7-b4bf00d37fa6, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef: { key: 10e8a8e3-b064-4aec-a4d5-b4bf00d37ff3, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: SLACK_CHANNEL_ID
      remoteRef: { key: bc346df2-c74e-430b-a3d3-b4bf00d38053, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: 0ae50cfd-3453-4df0-a700-b4bf00d3808b, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
